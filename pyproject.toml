[project]
name = "my-car-cli"
version = "0.1.0"
description = "A modern CLI for viewing car status"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
login = [
    "playwright>=1.40.0",
]

[project.scripts]
my-car = "my_car_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
